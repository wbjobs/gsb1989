<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>力导向图 · Canvas + Web Worker + IndexedDB</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9;
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #canvas:active { cursor: grabbing; }
  .panel { position: absolute; background: rgba(22,27,34,.92); border: 1px solid #30363d;
    border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(4px); }
  #controls { top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; }
  #controls .row { display: flex; align-items: center; gap: 8px; }
  #controls label { width: 56px; color: #8b949e; }
  select, button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  button:hover, select:hover { border-color: #58a6ff; }
  #stats { top: 12px; right: 12px; font-family: ui-monospace, monospace; font-size: 12px; }
  #legend { bottom: 12px; left: 12px; display: flex; gap: 12px; flex-wrap: wrap; max-width: 60vw; }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-item i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #hint { bottom: 12px; right: 12px; color: #8b949e; font-size: 12px; }
  #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%) translateY(-60px);
    background: #9e3a38; color: #fff; padding: 8px 18px; border-radius: 6px;
    transition: transform .25s ease; pointer-events: none; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls" class="panel">
  <div class="row">
    <label>节点数</label>
    <select id="nodeCount">
      <option value="500">500</option>
      <option value="1000" selected>1000</option>
      <option value="2000">2000</option>
      <option value="5000">5000</option>
    </select>
  </div>
  <div class="row">
    <label>簇数量</label>
    <select id="clusterCount">
      <option value="3">3</option>
      <option value="5" selected>5</option>
      <option value="8">8</option>
    </select>
  </div>
  <div class="row">
    <button id="regenerate">重新生成</button>
    <button id="reheat">重新布局</button>
    <button id="clearLayout">清除缓存</button>
  </div>
</div>

<div id="stats" class="panel">初始化中…</div>
<div id="legend" class="panel"></div>
<div id="hint" class="panel">拖拽节点 · 空白处拖动平移 · 滚轮缩放</div>
<div id="toast"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
